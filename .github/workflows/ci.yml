name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version consistency
        run: pnpm check:version

      - name: Check formatting
        run: pnpm format:check

      - name: Run frontend checks
        run: pnpm check

  desktop:
    name: Windows desktop build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # Tauri's generate_context!() needs frontendDist to exist even
      # while compiling the Rust application for Clippy/tests.
      # Build it once here and reuse it for the final desktop build.
      - name: Build frontend
        run: pnpm build

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      # The frontend was already built above. The CI-specific config
      # disables Tauri's normal beforeBuildCommand to avoid building it again.
      - name: Build Windows desktop application
        run: pnpm exec tauri build --config src-tauri/tauri.ci.conf.json
