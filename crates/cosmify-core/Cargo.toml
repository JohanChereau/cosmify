[package]
name = "cosmify-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
description = "Core engine for Cosmify"

[dependencies]
aes = "0.9.1"
base64 = "0.22"
cfb8 = "0.9.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.39"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = "4"

[dev-dependencies]
pretty_assertions = "1"
